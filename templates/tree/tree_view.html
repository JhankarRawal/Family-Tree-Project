{% extends "base.html" %}
{% load static %}

{% block content %}
<h2 class="mb-3 ms-4">Family Tree</h2>

<div class="controls mb-2 ms-4 d-flex gap-3 align-items-center">
    <label>
        <input type="checkbox" id="toggleDeceased" checked>
        Show deceased
    </label>

    <button class="btn btn-sm btn-primary" onclick="goToRelationshipCheck()">
        Check Relationship
    </button>

    <button class="btn btn-sm btn-primary" onclick="exportTreePDF()">
        Export PDF
    </button>

    <button class="btn btn-sm btn-secondary" onclick="exportGEDCOM()">
        Export GEDCOM
    </button>
</div>

<!-- Cytoscape container -->
<div id="familyTreeContainer" 
     style="width:100%; height:80vh; border:1px solid #ccc; overflow:auto;"></div>

<!-- Node details panel -->
<div id="nodeDetails" 
     style="position:absolute; top:20px; right:20px; background:#fff; border:1px solid #ccc;
            padding:10px; width:200px; font-size:14px; display:none; z-index:1000;">
    <img id="detailPhoto" src="" style="width:100%; height:auto; margin-bottom:10px;">
    <p><strong>Name:</strong> <span id="detailName"></span></p>
    <p><strong>Gender:</strong> <span id="detailGender"></span></p>
    <p><strong>Status:</strong> <span id="detailLiving"></span></p>
</div>

<!-- Pass Django context to JS -->
<script>
    window.FAMILY_ID = "{{ family_id }}";
    window.ROOT_ID = "{{ root_person.id }}";
</script>

<!-- Libraries -->
<script src="https://unpkg.com/cytoscape@3.27.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

<!-- Tree logic -->
<script src="{% static 'js/tree/tree.js' %}"></script>

<!-- Export logic -->
<script src="{% static 'js/export/export_pdf.js' %}"></script>
<script src="{% static 'js/export/export_gedcom.js' %}"></script>
<script>
// Redirect to relationship check page
function goToRelationshipCheck() {
    // Replace family.id with the Django context variable
    window.location.href = "{% url 'relationships:relationship_check_page' family_id %}";
}
</script>

{% endblock %}
