{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2 class="mb-3 ms-4">Click Two Nodes to Check Relationship</h2>
<p class="ms-4">Select two family members in the tree to see how they are related.</p>

<div id="familyTreeContainer" 
     style="width:100%; height:80vh; border:1px solid #ccc; overflow:auto;"></div>

<div id="relationship-result" 
     style="margin-top:20px; font-weight:bold; color:#1e40af; margin-left:16px;"></div>

<!-- Pass Django context to JS -->
<script>
    window.FAMILY_ID = "{{ family_id }}";
    window.ROOT_ID = "{{ root_person.id }}";
    window.RELATIONSHIP_MODE = true; // enable relationship mode
</script>

<!-- Cytoscape + layout -->
<script src="https://unpkg.com/cytoscape@3.27.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

<!-- Unified tree.js -->
<script src="{% static 'js/tree/tree.js' %}"></script>

<script>
/* Override handleRelationshipSelection to show result in div & highlight nodes */
const originalHandleRelationship = window.handleRelationshipSelection;

window.handleRelationshipSelection = function(personId, personName) {
    if (!window.selectedNodes) window.selectedNodes = [];

    if (window.selectedNodes.length < 2) {
        window.selectedNodes.push({id: personId, name: personName});
        const node = cy.getElementById(personId);
        if (node) node.addClass('selected-node');
    }

    if (window.selectedNodes.length === 2) {
        const familyId = "{{ family_id }}";
        fetch(`/families/${familyId}/relationship-check/api/${window.selectedNodes[0].id}/${window.selectedNodes[1].id}/`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('relationship-result').textContent =
                    `${window.selectedNodes[0].name} ↔ ${window.selectedNodes[1].name} : ${data.relationship}`;

                // Clear selection
                window.selectedNodes.forEach(n => {
                    const node = cy.getElementById(n.id);
                    if (node) node.removeClass('selected-node');
                });
                window.selectedNodes = [];
            })
            .catch(err => {
                console.error(err);
                window.selectedNodes = [];
            });
    }
};
</script>

<style>
/* Highlight selected nodes in Cytoscape */
.selected-node {
    border-color: rgb(240, 32, 13) !important;
    border-width: 4px !important;
}
</style>

{% endblock %}
